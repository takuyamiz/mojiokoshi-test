name: Build and deploy Whisper Tiny PWA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Clone whisper.cpp
        run: git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper.cpp

      - name: Build whisper.cpp WebAssembly
        run: |
          cd whisper.cpp
          mkdir -p build-em
          cd build-em
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_WASM_SINGLE_FILE=ON
          cmake --build . -j 2

      - name: Inspect build output
        run: |
          echo "=== build-em/bin ==="
          find whisper.cpp/build-em/bin -maxdepth 2 -type f -print | sort

      - name: Assemble PWA site
        run: |
          set -eux
          mkdir -p site/models site/icons

          # Copy the official whisper.wasm demo page/assets.
          cp -R whisper.cpp/build-em/bin/whisper.wasm/. site/

          # Current whisper.cpp default embeds WASM/workers in libmain.js.
          cp whisper.cpp/build-em/bin/libmain.js site/libmain.js

          cp pwa-assets/manifest.webmanifest site/manifest.webmanifest
          cp pwa-assets/sw.js site/sw.js
          cp pwa-assets/icons/* site/icons/

          # Tiny multilingual model (~74 MB).
          curl -L --fail --retry 5 --retry-delay 5 \
            -o site/models/ggml-tiny.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin

          python3 scripts/patch_demo.py
          touch site/.nojekyll

          echo "=== site output ==="
          find site -maxdepth 2 -type f -print | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
